server:
  host: "0.0.0.0"
  port: 8001
  mode: release

service:
  name: user-service

mysql:
  host: mysql
  port: 3306
  user: ash
  password: change_me_prod_ash
  database: ash_prod
  charset: utf8mb4
  max_idle_conns: 3
  max_open_conns: 10

auth:
  cookie_name: ash_sid
  cookie_path: /
  cookie_domain: ""
  cookie_secure: true
  cookie_same_site: lax
  session_ttl_days: 365
  last_seen_min_interval_sec: 300
  login_rate_limit_per_min: 20
  register_rate_limit_per_min: 10
  jwt_secret: change_me_prod_jwt_secret
  access_cookie_name: ash_at
  access_ttl_minutes: 15

log:
  level: info
  format: json
